version: '3.8'

services:
  rage-db:
    image: mongo:latest
    container_name: rage_mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: rage_password_123
    ports:
      - "27017:27017"
    volumes:
      - rage_data:/data/db

  # 2. Mongo Express
  rage-db-ui:
    image: mongo-express:latest
    container_name: rage_mongo_ui
    restart: always
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: rage_password_123
      ME_CONFIG_MONGODB_URL: mongodb://admin:rage_password_123@rage-db:27017/
      ME_CONFIG_BASICAUTH: false # Desactiva el login web para desarrollo rápido
    depends_on:
      - rage-db

# Volumen para que tus datos no se borren si apagas la computadora
volumes:
  rage_data: